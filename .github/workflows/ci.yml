name: CI

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node tests
        run: node --test apps/agent-escrow/test/escrow.test.mjs
      - name: Run Nightwatch tests
        run: node --test apps/nightwatch/test/metrics.test.mjs
      - name: Run AgentProof tests
        run: node --test apps/agent-proof/test/proofs.test.mjs
      - name: Run Midnight DID Wallet tests
        run: node --test apps/midnight-did-wallet/test/did.test.mjs
      - name: Run Ada Yield Tracker tests
        run: node --test apps/ada-yield/test/rewards.test.mjs
      - name: Run Ada Yield Pool Inspector tests
        run: node --test apps/ada-yield/test/poolid.test.mjs apps/ada-yield/test/poolhealth.test.mjs
      - name: Run Glacier Drop tests
        run: node --test apps/glacier-drop/test/glacier.test.mjs
      - name: Run Bridge Watch tests
        run: node --test apps/bridge-watch/test/bridge.test.mjs
      - name: Run Contract Watch tests
        run: node --test apps/midnight-contracts/test/address.test.mjs apps/midnight-contracts/test/analyze.test.mjs
      - name: Run NIGHT Market Tracker tests
        run: node --test apps/night-market/test/market.test.mjs
      - name: Run Governance Watch tests
        run: node --test apps/governance-watch/test/governance.test.mjs
      - name: Run Block Watch tests
        run: node --test apps/block-watch/test/blocks.test.mjs
      - name: Run Privacy Trend Watch tests
        run: node --test apps/privacy-watch/test/privacy.test.mjs

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        run: python -m unittest discover -s apps/agent-escrow/test -v
